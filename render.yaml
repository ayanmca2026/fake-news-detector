services:
  - type: web
    name: fake-news-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python -m nltk.downloader punkt punkt_tab stopwords wordnet omw-1.4"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fake-news-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://your-vercel-frontend-url.vercel.app"

  - type: psql
    name: fake-news-db
    plan: free
